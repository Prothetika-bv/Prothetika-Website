<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aanvraag ontvangen — Prothetika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', sans-serif;
  background: #0A0A0A;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}
.check { font-size: 72px; margin-bottom: 32px; animation: pop 0.5s ease; }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(40px, 6vw, 72px);
  font-weight: 700;
  line-height: 1.0;
  letter-spacing: -0.04em;
  margin-bottom: 20px;
  animation: fadeUp 0.6s ease 0.2s both;
}
p {
  font-size: 17px;
  line-height: 1.75;
  color: #AFAFAF;
  font-weight: 300;
  max-width: 480px;
  margin-bottom: 48px;
  animation: fadeUp 0.6s ease 0.3s both;
}
a {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #0A0A0A;
  background: #fff;
  padding: 14px 32px;
  text-decoration: none;
  display: inline-block;
  animation: fadeUp 0.6s ease 0.4s both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="check">✓</div>
  <h1>Aanvraag<br>ontvangen.</h1>
  <p>Wij nemen binnen één werkdag contact op ter bevestiging. U hoort snel van ons via e-mail.</p>
  <a href="index.html">Terug naar home</a>
</body>
</html>
